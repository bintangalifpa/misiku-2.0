name: Bangun APK Misiku

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang paket
        run: npm ci

      - name: Bangun tampilan aplikasi
        run: npm run build

      - name: Buat proyek Android
        run: npx cap add android

      - name: Pasang ikon, suara alarm, dan izin
        run: |
          unzip -o native.zip -d android/app/src/main
          node scripts/patch-manifest.mjs
          node scripts/patch-signing.mjs
          npx cap sync android

      - name: Bangun APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Misiku-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
